<!DOCTYPE html>
<html>
    <head>
        <title>Error - YouTube Music Recommender</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <body>

        <header class="p-3 bg-dark text-white">
            <div class="container1">
              <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">

                <a style="position:absolute; right:100px; top:15px"  href="/"> <button type="button" class="btn btn-outline-light me-2">Home</button> </a>
                <a style="position:absolute; right:10px; top:15px"  href="/about"> <button type="button" class="btn btn-outline-light me-2">About</button> </a>
              </div>
            </div>
        </header>
        <div class="break"></div>

        <div class='container'>
            <div class='results'>
                <h2 style='color: #ff5252'>Error</h2>
                <p style='color: #ff9800; font-size: 14pt; margin: 20px 0;'>{{ message }}</p>
                <div class="break"></div>
                <a href="/" class="btn btn-primary">Back to Home</a>
            </div>
        </div>

    </body>
</html>
